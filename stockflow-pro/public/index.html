<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockFlow Pro</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://unpkg.com/lucide@0.441.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="flex h-screen overflow-hidden">
  <div id="backdrop" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden"></div>
  <aside id="sidebar" class="flex flex-col shrink-0">
    <div class="flex items-center gap-3 px-5 h-16 text-white border-b border-white/10">
      <i data-lucide="boxes" class="w-7 h-7 text-sky-300 shrink-0"></i><span class="logo-text text-lg font-bold">StockFlow Pro</span>
    </div>
    <nav id="nav" class="flex-1 overflow-y-auto py-3"></nav>
  </aside>
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center gap-3 px-4 lg:px-6 shrink-0">
      <button id="menuBtn" class="icon-btn"><i data-lucide="menu" class="w-5 h-5"></i></button>
      <div class="relative flex-1 max-w-md">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
        <input id="globalSearch" class="input pl-9" placeholder="Search products by name, SKU or barcode...">
      </div>
      <div class="flex-1"></div>
      <div class="relative">
        <button id="bellBtn" class="icon-btn relative"><i data-lucide="bell" class="w-5 h-5"></i><span id="bellCount" class="hidden absolute -top-0.5 -right-0.5 bg-red-500 text-white text-[10px] rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center"></span></button>
        <div id="bellPanel" class="hidden absolute right-0 mt-2 w-80 card z-50 overflow-hidden"></div>
      </div>
      <div class="relative">
        <button id="profileBtn" class="flex items-center gap-2 pl-2 cursor-pointer">
          <div id="avatar" class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-semibold"></div>
          <div class="hidden sm:block text-left leading-tight"><div id="uName" class="text-sm font-semibold"></div><div id="uRole" class="text-xs text-slate-500"></div></div>
          <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
        </button>
        <div id="profilePanel" class="hidden absolute right-0 mt-2 w-52 card z-50 py-1">
          <button id="pwBtn" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 flex items-center gap-2"><i data-lucide="key-round" class="w-4 h-4"></i>Change password</button>
          <button id="logoutBtn" class="w-full text-left px-4 py-2 text-sm hover:bg-red-50 text-red-600 flex items-center gap-2"><i data-lucide="log-out" class="w-4 h-4"></i>Logout</button>
        </div>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto p-4 lg:p-6">
      <nav id="crumb" class="text-xs text-slate-500 mb-3"></nav>
      <div id="view" class="fade"></div>
    </main>
  </div>
</div>
<div id="toasts" class="fixed bottom-4 right-4 z-[100] space-y-2"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/products.js"></script>
<script src="/js/warehouses.js"></script>
<script src="/js/inventory.js"></script>
<script src="/js/suppliers.js"></script>
<script src="/js/customers.js"></script>
<script src="/js/pending.js"></script>
<script>App.start();</script>
</body></html>
